<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultrasound Duty Fairness Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .settings { background: #f9f9f9; padding: 10px; margin-bottom: 20px; border: 1px solid #ddd; }
    .settings summary { cursor: pointer; font-weight: bold; }
    input[type="text"] { width: 100%; margin: 5px 0; padding: 6px; }
    button, select { margin: 8px 5px; padding: 8px 16px; font-size: 15px; cursor: pointer; }
    .section { margin: 30px 0; }
    table { border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: center; font-size: 14px; }
    th { background: #f0f0f0; }
    .suggested { background-color: #d4edda; font-weight: bold; }
    .note { font-size: 0.85em; color: #555; }
    canvas { max-width: 100%; height: 400px; }
    .imbalance-green { background-color: #d4edda; color: #155724; }
    .imbalance-yellow { background-color: #fff3cd; color: #856404; }
    .imbalance-red { background-color: #f8d7da; color: #721c24; }
    .no-data { color: #888; font-style: italic; }
    .status { font-size: 0.9em; color: #007700; margin-left: 10px; }
  </style>
</head>
<body>
  <h2>Ultrasound Duty Fairness Dashboard</h2>

  <details class="settings" id="settingsPanel">
    <summary>⚙️ Dashboard Settings</summary>
    <p class="note">Paste your published Google Sheet CSV URL here, then click “Save & Reload”.<br>
       The sheet must have columns: <code>Date, Radiographer, Duty</code>.</p>
    <input type="text" id="sheetUrlInput" placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv">
    <br>
    <button onclick="saveSheetUrl()">💾 Save & Reload</button>
    <button onclick="resetToSample()" style="background:#f8d7da;">↩ Reset to Sample Data</button>
  </details>

  <div class="section">
    <button onclick="refreshData()">🔄 Refresh Data from Sheet</button>
    <span id="lastUpdated" class="status"></span>
  </div>

  <div class="section">
    <label for="monthSelect"><strong>Month:</strong></label>
    <select id="monthSelect" onchange="updateDashboard()">
      <option value="All">All months</option>
    </select>
    <label for="dutySelect" style="margin-left:20px;"><strong>Duty:</strong></label>
    <select id="dutySelect" onchange="updateDashboard()">
      <option value="All">All duties</option>
    </select>
  </div>

  <div id="chartSection" class="section">
    <h3>Duties per radiographer (stacked by month)</h3>
    <canvas id="dutyChart"></canvas>
    <div id="noDataMessage" style="display:none;" class="no-data"></div>
  </div>

  <div id="tableSection" class="section">
    <h3>Duty counts – green = suggested for next roster</h3>
    <div id="fairTable"></div>
  </div>

  <script>
    const DEFAULT_SHEET_URL = "";

    // Sample data includes ultrasound and "Non-Ultrasound"
    const SAMPLE_CSV = `Date,Radiographer,Duty
2026-01-05,Alice,USP.
2026-01-05,Bob,KUS
2026-01-06,Alice,Non-Ultrasound
2026-01-06,Carol,USG
2026-01-12,Dave,USP.
2026-01-12,Bob,Non-Ultrasound
2026-02-02,Alice,USP.
2026-02-09,Carol,KUS
2026-02-16,Dave,Non-Ultrasound
2026-02-23,Bob,USP.
2026-03-02,Alice,KUS
2026-03-09,Carol,USP.
2026-03-16,Dave,KUS
2026-03-23,Bob,Non-Ultrasound
2026-04-06,Alice,Non-Ultrasound
2026-04-13,Carol,USP.
2026-04-20,Dave,USP.
2026-04-27,Bob,KUS`;

    let allRecords = [];
    let allRadiographers = [];
    let chartInstance = null;

    // ---------- Helpers ----------
    function parseDate(str) {
      const d = new Date(str + 'T00:00:00');
      return isNaN(d.getTime()) ? null : d;
    }

    function getMonthStr(d) {
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    }

    // ---------- Sheet URL management ----------
    function getSheetUrl() {
      return localStorage.getItem('dashboardSheetUrl') || DEFAULT_SHEET_URL;
    }

    function saveSheetUrl() {
      const url = document.getElementById('sheetUrlInput').value.trim();
      if (url && !url.startsWith('https://docs.google.com/spreadsheets/d/e/')) {
        alert('Invalid Google Sheets CSV URL.');
        return;
      }
      localStorage.setItem('dashboardSheetUrl', url);
      refreshData();
    }

    function resetToSample() {
      localStorage.removeItem('dashboardSheetUrl');
      document.getElementById('sheetUrlInput').value = '';
      loadDataFromCSV(SAMPLE_CSV, false);
    }

    // ---------- Data loading ----------
    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
      if (lines.length === 0) return [];

      const firstLine = lines[0].toLowerCase();
      const isHeader = firstLine.includes('date') || firstLine.includes('radiographer') || firstLine.includes('duty');
      const startIndex = isHeader ? 1 : 0;

      const records = [];
      for (let i = startIndex; i < lines.length; i++) {
        const parts = lines[i].split(',');
        if (parts.length >= 3) {
          const dateStr = parts[0].trim();
          const radiographer = parts[1].trim();
          const duty = parts[2].trim();
          if (dateStr && radiographer && duty) {
            const d = parseDate(dateStr);
            if (d) {
              records.push({
                date: dateStr,
                month: getMonthStr(d),
                radiographer,
                duty
              });
            }
          }
        }
      }
      return records;
    }

    function loadDataFromCSV(csvText, updateLastTime = true) {
      const parsed = parseCSV(csvText);
      if (parsed.length === 0) {
        alert('No valid records found.');
        return;
      }
      allRecords = parsed;
      allRadiographers = [...new Set(allRecords.map(r => r.radiographer))].sort();
      if (updateLastTime) {
        localStorage.setItem('lastRefresh', new Date().toLocaleString());
      }
      document.getElementById('lastUpdated').textContent = updateLastTime ?
        `Last refreshed: ${localStorage.getItem('lastRefresh')}` : '';
      populateFilters();
      updateDashboard();
    }

    async function refreshData() {
      const url = getSheetUrl();
      if (!url) {
        loadDataFromCSV(SAMPLE_CSV, false);
        document.getElementById('lastUpdated').textContent = 'Using sample data. Set a sheet URL in settings.';
        return;
      }
      document.getElementById('lastUpdated').textContent = 'Loading...';
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = await response.text();
        loadDataFromCSV(text, true);
      } catch (err) {
        alert('Failed to fetch data: ' + err.message);
        document.getElementById('lastUpdated').textContent = 'Error loading data.';
      }
    }

    // ---------- Filters ----------
    function populateFilters() {
      // Months
      const months = [...new Set(allRecords.map(r => r.month))].sort();
      const monthSelect = document.getElementById('monthSelect');
      const curMonth = monthSelect.value;
      monthSelect.innerHTML = '<option value="All">All months</option>';
      months.forEach(m => {
        const opt = document.createElement('option'); opt.value = m; opt.textContent = m;
        monthSelect.appendChild(opt);
      });
      monthSelect.value = months.includes(curMonth) ? curMonth : 'All';

      // Duties
      const duties = [...new Set(allRecords.map(r => r.duty))].sort();
      const dutySelect = document.getElementById('dutySelect');
      const curDuty = dutySelect.value;
      dutySelect.innerHTML = '<option value="All">All duties</option>';
      duties.forEach(d => {
        const opt = document.createElement('option'); opt.value = d; opt.textContent = d;
        dutySelect.appendChild(opt);
      });
      dutySelect.value = duties.includes(curDuty) ? curDuty : 'All';
    }

    // ---------- Dashboard update ----------
    function updateDashboard() {
      const selectedMonth = document.getElementById('monthSelect').value;
      const selectedDuty = document.getElementById('dutySelect').value;

      let records = allRecords.slice();
      if (selectedMonth !== 'All') records = records.filter(r => r.month === selectedMonth);
      if (selectedDuty !== 'All') records = records.filter(r => r.duty === selectedDuty);

      updateChart(records, selectedDuty, selectedMonth);
      updateTable(records, selectedDuty);
    }

    // ---------- Chart ----------
    function updateChart(records, selectedDuty, selectedMonth) {
      const canvas = document.getElementById('dutyChart');
      const noDataDiv = document.getElementById('noDataMessage');

      if (typeof Chart === 'undefined') {
        noDataDiv.style.display = 'block';
        noDataDiv.textContent = 'Chart library not loaded.';
        canvas.style.display = 'none';
        return;
      }

      if (allRadiographers.length === 0) {
        noDataDiv.style.display = 'block';
        noDataDiv.textContent = 'No staff data.';
        canvas.style.display = 'none';
        if (chartInstance) chartInstance.destroy();
        return;
      }

      const radiographers = allRadiographers;
      let datasets;

      if (selectedMonth === 'All') {
        // Stacked by month
        const months = [...new Set(records.map(r => r.month))].sort();
        datasets = months.map((month, idx) => {
          const hue = (idx * 47) % 360;
          return {
            label: month,
            data: radiographers.map(rad => records.filter(r => r.radiographer === rad && r.month === month).length),
            backgroundColor: `hsla(${hue}, 70%, 60%, 0.8)`,
            borderColor: `hsl(${hue}, 70%, 40%)`,
            borderWidth: 1
          };
        });
      } else {
        // Single month → plain bar
        datasets = [{
          label: selectedMonth,
          data: radiographers.map(rad => records.filter(r => r.radiographer === rad).length),
          backgroundColor: 'hsla(210, 70%, 60%, 0.8)',
          borderColor: 'hsl(210, 70%, 40%)',
          borderWidth: 1
        }];
      }

      // Even with zero records, show a flat chart
      if (records.length === 0) {
        noDataDiv.style.display = 'block';
        noDataDiv.textContent = 'No data for the selected filters.';
        canvas.style.display = 'none';
        if (chartInstance) chartInstance.destroy();
        return;
      }

      noDataDiv.style.display = 'none';
      canvas.style.display = 'block';
      const ctx = canvas.getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: { labels: radiographers, datasets },
        options: {
          responsive: true,
          plugins: {
            tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}: ${ctx.raw} duties` } },
            legend: { position: 'bottom' },
            title: {
              display: true,
              text: (selectedDuty === 'All' ? 'All duties' : selectedDuty) +
                    (selectedMonth === 'All' ? ' – all months' : ' – ' + selectedMonth),
              font: { size: 16 }
            }
          },
          scales: {
            x: { stacked: selectedMonth === 'All', title: { display: true, text: 'Radiographer' } },
            y: { stacked: selectedMonth === 'All', title: { display: true, text: 'Number of duties' }, beginAtZero: true, ticks: { stepSize: 1 } }
          }
        }
      });
    }

    // ---------- Table with imbalance ----------
    function updateTable(records, selectedDuty) {
      if (allRadiographers.length === 0) {
        document.getElementById('fairTable').innerHTML = '<p class="no-data">No staff data.</p>';
        return;
      }
      if (selectedDuty === 'All') {
        document.getElementById('fairTable').innerHTML = '<p class="note">⚠️ Select a specific duty to see fairness table.</p>';
        return;
      }

      const radiographers = allRadiographers;
      const counts = {};
      radiographers.forEach(rad => counts[rad] = 0);
      records.forEach(rec => { counts[rec.radiographer] = (counts[rec.radiographer] || 0) + 1; });

      let minCount = Math.min(...Object.values(counts));
      const vals = Object.values(counts);
      const mean = vals.reduce((a,b) => a+b, 0) / vals.length;
      let cv = 0;
      if (mean > 0) {
        const variance = vals.reduce((sum, v) => sum + (v - mean)**2, 0) / vals.length;
        cv = Math.round((Math.sqrt(variance) / mean) * 100);
      }

      function imbalanceClass(cv) {
        if (cv <= 30) return 'imbalance-green';
        if (cv <= 50) return 'imbalance-yellow';
        return 'imbalance-red';
      }

      let html = '<table><thead><tr><th>Radiographer</th><th>' + selectedDuty + '</th></tr></thead><tbody>';
      radiographers.forEach(rad => {
        const val = counts[rad];
        const cellClass = (val === minCount) ? 'class="suggested"' : '';
        html += `<tr><td><strong>${rad}</strong></td><td ${cellClass}>${val}</td></tr>`;
      });
      html += `<tr style="font-weight:bold;"><td>Balance score</td><td class="${imbalanceClass(cv)}">${cv}%</td></tr>`;
      html += '</tbody></table>';
      html += `<p class="note">🟢 Green cells = fewest assignments → suggested for next roster.<br>
                Balance score: <span class="imbalance-green">0–30% very fair</span>,
                <span class="imbalance-yellow">30–50% moderate</span>,
                <span class="imbalance-red">over 50% needs attention</span>.</p>`;
      document.getElementById('fairTable').innerHTML = html;
    }

    // ---------- Init ----------
    window.onload = function() {
      const url = getSheetUrl();
      document.getElementById('sheetUrlInput').value = url;
      if (url) refreshData();
      else {
        loadDataFromCSV(SAMPLE_CSV, false);
        document.getElementById('lastUpdated').textContent = 'Using sample data. Set a sheet URL in settings.';
      }
    };
  </script>
</body>
</html>
